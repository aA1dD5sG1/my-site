<!DOCTYPE html>
<html>
<head>
  <title>موقعي</title>
</head>

<body>
<h2>أول منشور</h2>
<p>هذا أول محتوى في الموقع</p>
  <h1>مرحبا بك في موقعي</h1>
<h3>التعليقات</h3>

<input type="text" id="commentInput" placeholder="اكتب تعليقك">
<button onclick="addComment()">إرسال</button>

<div id="comments"></div>
<script>
function addComment() {
  let input = document.getElementById("commentInput");
  let comments = document.getElementById("comments");

  comments.innerHTML += "<p>" + input.value + "</p>";

  input.value = "";
}
  </script>
</body>
</html>
